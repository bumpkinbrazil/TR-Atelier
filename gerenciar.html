<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu agendamento — TR Atelier</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="TR Atelier">
      <span class="txt"><b>TR ATELIER</b><span>Tatto Fernandes e Re Arfelli</span></span>
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html#servicos">Serviços</a>
      <a href="orcamento.html">Orçamento</a>
      <a href="agendar.html">Agendar</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Meu agendamento</p>
      <h2>Gerenciar</h2>
    </div>
    <div class="panel" id="box"><p class="muted center">Carregando…</p></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<script src="assets/config.js"></script>
<script src="assets/main.js"></script>
<script>
(function(){
  var TR=window.TR, db=TR.db, box=document.getElementById("box");
  var badge={pendente:"b-pendente",confirmado:"b-confirmado",concluido:"b-concluido",cancelado:"b-cancelado"};
  var qs=new URLSearchParams(location.search);
  var id=qs.get("id"), token=qs.get("t");

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  async function load(){
    if(!TR.configured){ box.innerHTML='<p class="muted center">Site não conectado ao banco.</p>'; return; }
    if(!id||!token){ box.innerHTML='<p class="muted center">Link inválido.</p>'; return; }
    var r = await db.rpc("get_appointment",{ p_id:id, p_token:token });
    if(r.error || !r.data || !r.data.ok){ box.innerHTML='<div class="center"><p class="muted">Agendamento não encontrado ou link expirado.</p><a href="agendar.html" class="btn btn-gold" style="margin-top:12px">Fazer um agendamento</a></div>'; return; }
    var a=r.data, dataBr=a.date.split("-").reverse().join("/");
    var cancelado = a.status==="cancelado";
    box.innerHTML =
      '<div class="summary" style="margin-bottom:20px">'+
        '<div><span>Serviço</span><b>'+esc(a.service)+'</b></div>'+
        (a.professional?'<div><span>Profissional</span><span>'+esc(a.professional)+'</span></div>':'')+
        '<div><span>Data</span><span>'+dataBr+'</span></div>'+
        '<div><span>Horário</span><span>'+esc(a.time)+'</span></div>'+
        '<div><span>Status</span><span class="badge '+(badge[a.status]||"")+'">'+esc(a.status)+'</span></div>'+
      '</div>'+
      (cancelado
        ? '<p class="muted center">Este agendamento foi cancelado.</p><div class="center"><a href="agendar.html" class="btn btn-gold" style="margin-top:8px">Agendar novo horário</a></div>'
        : '<div class="grid-2"><button class="btn btn-ghost" id="btnCancel">Cancelar agendamento</button>'+
          '<a class="btn btn-gold" href="agendar.html">Remarcar (novo horário)</a></div>'+
          '<p class="muted center" id="msg" style="margin-top:14px;font-size:.85rem">Para remarcar, cancele este e faça um novo — assim seu horário volta a ficar livre pra outra pessoa.</p>');

    // Convite para avaliar no Google (aparece para agendamentos concluídos ou ativos)
    if(!cancelado){
      try{
        var gr = await db.rpc("get_reviews",{ p_limit:1 });
        var gurl = gr && gr.data && gr.data.url;
        if(gurl){
          var invite=document.createElement("div");
          invite.className="center";
          invite.style.marginTop="22px";
          invite.innerHTML='<p class="muted" style="font-size:.88rem;margin:0 0 10px">Gostou do atendimento? Sua avaliação ajuda muito! ⭐</p>'+
            '<a class="btn btn-gold" href="'+esc(gurl)+'" target="_blank" rel="noopener">Avaliar no Google ★</a>';
          box.appendChild(invite);
        }
      }catch(e){}
    }

    var bc=document.getElementById("btnCancel");
    if(bc) bc.addEventListener("click", async function(){
      if(!confirm("Tem certeza que quer cancelar este agendamento?")) return;
      bc.disabled=true; bc.textContent="Cancelando…";
      var cr = await db.rpc("cancel_appointment",{ p_id:id, p_token:token });
      if(cr.error || !cr.data || !cr.data.ok){ document.getElementById("msg").textContent = (cr.data&&cr.data.error)||"Não foi possível cancelar."; bc.disabled=false; bc.textContent="Cancelar agendamento"; return; }
      load();
    });
  }
  load();
})();
</script>
</body>
</html>
