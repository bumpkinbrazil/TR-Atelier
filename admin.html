<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — TR Atelier</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="admin-top">
  <div class="container">
    <span class="brand"><b>✦ TR Atelier</b></span>
    <nav id="tabs" class="hidden">
      <a data-tab="agenda" class="on">Agenda</a>
      <a data-tab="relatorios">Relatórios</a>
      <a data-tab="profissionais">Profissionais</a>
      <a data-tab="bloqueios">Bloqueios</a>
      <a data-tab="avaliacoes">Avaliações</a>
      <a data-tab="servicos">Serviços & Preços</a>
      <a data-tab="orcamentos">Orçamentos</a>
      <a data-tab="config">Configurações</a>
      <a href="index.html" target="_blank">Ver site ↗</a>
    </nav>
    <a href="#" id="logout" class="muted" style="margin-left:auto;font-size:.86rem">Sair →</a>
  </div>
</header>

<div class="container" style="padding:28px 24px 70px">
  <div id="gate"><p class="muted">Carregando…</p></div>
  <div id="app" class="hidden">
    <div class="tabpane on" id="pane-agenda"></div>
    <div class="tabpane" id="pane-relatorios"></div>
    <div class="tabpane" id="pane-profissionais"></div>
    <div class="tabpane" id="pane-bloqueios"></div>
    <div class="tabpane" id="pane-avaliacoes"></div>
    <div class="tabpane" id="pane-servicos"></div>
    <div class="tabpane" id="pane-orcamentos"></div>
    <div class="tabpane" id="pane-config"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/main.js"></script>
<script>
(function(){
  "use strict";
  var TR=window.TR, db=TR.db;
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var badge={pendente:"b-pendente",confirmado:"b-confirmado",concluido:"b-concluido",cancelado:"b-cancelado",novo:"b-novo",respondido:"b-confirmado",fechado:"b-concluido"};
  var brDate=function(d){return d?d.split("-").reverse().join("/"):"";};

  el("logout").addEventListener("click", async function(e){ e.preventDefault(); if(db) await db.auth.signOut(); location.href="index.html"; });

  // ---------- GATE ----------
  async function gate(){
    if(!TR.configured){ el("gate").innerHTML='<div class="panel"><p class="muted">Conecte o Supabase em <b>assets/config.js</b> para usar o painel.</p></div>'; return; }
    var user=await TR.getUser();
    if(!user){
      el("gate").innerHTML='<div class="panel" style="max-width:420px"><h2 style="font-family:var(--serif);color:var(--gold);margin-top:0">Área do salão</h2>'+
        '<p class="muted">Entre com email e senha para acessar o painel.</p>'+
        '<div class="field" style="margin-top:12px"><label>Email</label><input id="ae" type="email" placeholder="seu@email.com"></div>'+
        '<div class="field"><label>Senha</label><input id="ap" type="password" placeholder="mín. 6 caracteres"></div>'+
        '<button class="btn btn-gold btn-block" id="ain">Entrar</button>'+
        '<button class="btn btn-ghost btn-block" id="aup" style="margin-top:10px">Criar conta (1ª vez)</button>'+
        '<p class="muted" id="amsg" style="font-size:.84rem;margin-top:10px"></p></div>';
      var creds=function(){ return { email:(el("ae").value||"").trim(), password:(el("ap").value||"") }; };
      var valid=function(c){ return /.+@.+\..+/.test(c.email) && c.password.length>=6; };
      el("ain").addEventListener("click", async function(){
        var c=creds(); if(!valid(c)){ el("amsg").textContent="Preencha email e senha (mín. 6)."; return; }
        el("ain").disabled=true; var r=await db.auth.signInWithPassword(c); el("ain").disabled=false;
        if(r.error){ el("amsg").textContent="Email ou senha incorretos."; } else { location.reload(); }
      });
      el("aup").addEventListener("click", async function(){
        var c=creds(); if(!valid(c)){ el("amsg").textContent="Preencha email e senha (mín. 6)."; return; }
        el("aup").disabled=true; var r=await db.auth.signUp(c); el("aup").disabled=false;
        if(r.error){ el("amsg").textContent="Erro: "+(r.error.message||"tente outro email"); }
        else if(r.data && r.data.session){ location.reload(); }
        else { el("amsg").textContent="Conta criada! Se pedir confirmação por email, desative 'Confirm email' no Supabase (Authentication → Sign In / Providers → Email) e clique em Entrar."; }
      });
      return;
    }
    var { data:isAdmin } = await db.rpc("is_admin");
    if(!isAdmin){
      el("gate").innerHTML='<div class="panel" style="max-width:520px"><h2 style="font-family:var(--serif);color:var(--gold);margin-top:0">Sem permissão</h2>'+
        '<p class="muted">Esta conta ('+esc(user.email)+') ainda não é administradora.<br><br>No Supabase → Table Editor → <b>admins</b> → Insert row, cole seu <b>user id</b> (Authentication → Users). Depois recarregue.</p>'+
        '<button class="btn btn-ghost" id="out">Trocar de conta</button></div>';
      el("out").addEventListener("click", async function(){ await db.auth.signOut(); location.reload(); });
      return;
    }
    el("gate").classList.add("hidden"); el("app").classList.remove("hidden"); el("tabs").classList.remove("hidden");
    setupTabs(); renderAgenda(); renderRelatorios(); renderProfissionais(); renderBloqueios(); renderAvaliacoes(); renderServicos(); renderOrcamentos(); renderConfig();
  }

  function setupTabs(){
    el("tabs").querySelectorAll("[data-tab]").forEach(function(a){
      a.addEventListener("click",function(e){ e.preventDefault();
        el("tabs").querySelectorAll("[data-tab]").forEach(function(x){x.classList.remove("on");});
        a.classList.add("on");
        document.querySelectorAll(".tabpane").forEach(function(p){p.classList.remove("on");});
        el("pane-"+a.dataset.tab).classList.add("on");
      });
    });
  }

  // ---------- AGENDA ----------
  async function renderAgenda(){
    var pane=el("pane-agenda");
    var today=new Date(); var off=today.getTimezoneOffset()*60000; var todayStr=new Date(today-off).toISOString().slice(0,10);
    var { data, error } = await db.from("appointments").select("*, services(name), professionals(name)").order("appt_date").order("appt_time");
    if(error){ pane.innerHTML='<div class="panel"><p class="muted">Erro ao carregar agenda.</p></div>'; return; }
    var todayCount=data.filter(function(a){return a.appt_date===todayStr && a.status!=="cancelado";}).length;
    var pend=data.filter(function(a){return a.status==="pendente";}).length;
    var upc=data.filter(function(a){return a.appt_date>=todayStr && (a.status==="pendente"||a.status==="confirmado");}).length;
    var rows=data.map(function(a){
      var wa=(a.customer_phone||"").replace(/\D/g,"");
      var acts="";
      if(a.status==="pendente") acts+='<button class="btn btn-sm btn-gold" data-act="confirmado" data-id="'+a.id+'">Confirmar</button>';
      if(a.status==="pendente"||a.status==="confirmado"){
        acts+='<button class="btn btn-sm" data-act="concluido" data-id="'+a.id+'">Concluir</button>';
        acts+='<button class="btn btn-sm" data-act="cancelado" data-id="'+a.id+'">Cancelar</button>';
      }
      return '<tr><td><b>'+brDate(a.appt_date)+'</b><br><span class="muted">'+a.appt_time.slice(0,5)+'</span></td>'+
        '<td>'+esc(a.customer_name)+(a.notes?'<br><span class="muted" style="font-size:.8rem">“'+esc(a.notes)+'”</span>':'')+'</td>'+
        '<td>'+esc(a.services?a.services.name:"")+(a.professionals?'<br><span class="muted" style="font-size:.8rem">👤 '+esc(a.professionals.name)+'</span>':"")+'</td>'+
        '<td><a href="https://wa.me/55'+wa+'" target="_blank" style="color:var(--gold)">'+esc(a.customer_phone)+'</a></td>'+
        '<td><span class="badge '+(badge[a.status]||"")+'">'+a.status+'</span></td>'+
        '<td><div class="row-actions">'+acts+'</div></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 4px">Agenda</h1>'+
      '<p class="muted" style="margin:0 0 22px">Gerencie os agendamentos em tempo real.</p>'+
      '<div class="stat-row"><div class="stat"><b>'+todayCount+'</b><span>Hoje</span></div>'+
      '<div class="stat"><b>'+pend+'</b><span>Aguardando confirmação</span></div>'+
      '<div class="stat"><b>'+upc+'</b><span>Próximos ativos</span></div>'+
      '<div class="stat"><b>'+data.length+'</b><span>Total</span></div></div>'+
      '<div class="panel" style="max-width:none">'+(data.length?'<table><thead><tr><th>Data/Hora</th><th>Cliente</th><th>Serviço</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="muted center">Nenhum agendamento ainda.</p>')+'</div>';
    pane.querySelectorAll("[data-act]").forEach(function(b){
      b.addEventListener("click", async function(){ b.disabled=true;
        await db.from("appointments").update({status:b.dataset.act}).eq("id",b.dataset.id); renderAgenda(); renderOrcamentos();
      });
    });
  }

  // ---------- SERVIÇOS ----------
  var editId=null;
  async function renderServicos(){
    var pane=el("pane-servicos");
    var { data } = await db.from("services").select("*").order("sort_order");
    data=data||[];
    var ed = editId ? data.filter(function(s){return s.id===editId;})[0] : null;
    var rows=data.map(function(s){
      return '<tr><td>'+s.sort_order+'</td><td><b>'+esc(s.name)+'</b><br><span class="muted" style="font-size:.8rem">'+esc(s.description)+'</span></td>'+
        '<td>'+TR.money(s.price)+'</td><td>'+s.duration_min+' min</td>'+
        '<td>'+(s.active?'<span class="badge b-confirmado">Ativo</span>':'<span class="badge b-cancelado">Inativo</span>')+'</td>'+
        '<td><div class="row-actions"><button class="btn btn-sm" data-edit="'+s.id+'">Editar</button>'+
        '<button class="btn btn-sm" data-del="'+s.id+'">Excluir</button></div></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 22px">Serviços & Preços</h1>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">'+(ed?"Editar serviço":"Novo serviço")+'</h2>'+
      '<div class="grid-2"><div class="field"><label>Nome</label><input id="s_name" value="'+esc(ed?ed.name:"")+'"></div>'+
      '<div class="field"><label>Descrição</label><input id="s_desc" value="'+esc(ed?ed.description:"")+'"></div></div>'+
      '<div class="grid-2"><div class="field"><label>Preço (R$)</label><input id="s_price" value="'+(ed?ed.price:"")+'" placeholder="100.00"></div>'+
      '<div class="field"><label>Duração (min)</label><input id="s_dur" type="number" value="'+(ed?ed.duration_min:30)+'"></div></div>'+
      '<div class="grid-2"><div class="field"><label>Ordem</label><input id="s_ord" type="number" value="'+(ed?ed.sort_order:0)+'"></div>'+
      '<div class="field"><label>&nbsp;</label><label style="color:var(--cream)"><input type="checkbox" id="s_act" '+(!ed||ed.active?"checked":"")+'> Ativo (aparece no site)</label></div></div>'+
      '<button class="btn btn-gold" id="s_save">'+(ed?"Salvar":"Adicionar")+'</button> '+(ed?'<button class="btn btn-ghost" id="s_cancel">Cancelar</button>':'')+'</div>'+
      '<div class="panel" style="max-width:none"><table><thead><tr><th>Ordem</th><th>Serviço</th><th>Preço</th><th>Duração</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

    el("s_save").addEventListener("click", async function(){
      var payload={name:(el("s_name").value||"").trim(),description:(el("s_desc").value||"").trim(),
        price:parseFloat((el("s_price").value||"0").replace(",","."))||0,duration_min:parseInt(el("s_dur").value)||30,
        sort_order:parseInt(el("s_ord").value)||0,active:el("s_act").checked};
      if(!payload.name){ alert("Informe o nome."); return; }
      if(ed){ await db.from("services").update(payload).eq("id",ed.id); } else { await db.from("services").insert(payload); }
      editId=null; renderServicos();
    });
    if(el("s_cancel")) el("s_cancel").addEventListener("click",function(){ editId=null; renderServicos(); });
    pane.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click",function(){ editId=b.dataset.edit; renderServicos(); window.scrollTo({top:0,behavior:"smooth"}); }); });
    pane.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", async function(){ if(!confirm("Excluir este serviço?"))return; await db.from("services").delete().eq("id",b.dataset.del); renderServicos(); }); });
  }

  // ---------- ORÇAMENTOS ----------
  async function renderOrcamentos(){
    var pane=el("pane-orcamentos");
    var { data } = await db.from("quote_requests").select("*").order("created_at",{ascending:false});
    data=data||[];
    var rows=data.map(function(q){
      var wa=(q.phone||"").replace(/\D/g,"");
      var next = q.status==="novo" ? "respondido" : (q.status==="respondido"?"fechado":"novo");
      return '<tr><td>'+esc(q.name)+'<br><a href="https://wa.me/55'+wa+'" target="_blank" style="color:var(--gold);font-size:.84rem">'+esc(q.phone)+'</a></td>'+
        '<td>'+esc(q.service_interest||"-")+'</td><td style="max-width:280px">'+esc(q.message||"")+'</td>'+
        '<td><span class="badge '+(badge[q.status]||"")+'">'+q.status+'</span></td>'+
        '<td><button class="btn btn-sm" data-q="'+q.id+'" data-next="'+next+'">→ '+next+'</button></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Pedidos de Orçamento</h1>'+
      '<p class="muted" style="margin:0 0 22px">Clientes que pediram orçamento pelo site.</p>'+
      '<div class="panel" style="max-width:none">'+(data.length?'<table><thead><tr><th>Cliente</th><th>Interesse</th><th>Mensagem</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="muted center">Nenhum pedido ainda.</p>')+'</div>';
    pane.querySelectorAll("[data-q]").forEach(function(b){ b.addEventListener("click", async function(){ await db.from("quote_requests").update({status:b.dataset.next}).eq("id",b.dataset.q); renderOrcamentos(); }); });
  }

  // ---------- CONFIG ----------
  async function renderConfig(){
    var pane=el("pane-config");
    var { data } = await db.from("settings").select("*");
    var map={}; (data||[]).forEach(function(r){ map[r.key]=r.value; });
    function f(k,label,ph){ return '<div class="field"><label>'+label+'</label><input id="cfg_'+k+'" value="'+esc(map[k]||"")+'" placeholder="'+(ph||"")+'"></div>'; }
    var days=[["1","Seg"],["2","Ter"],["3","Qua"],["4","Qui"],["5","Sex"],["6","Sáb"],["0","Dom"]];
    var wd=(map.work_days||"0,1,2,3,4,5,6").split(",");
    var dayboxes=days.map(function(d){return '<label style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;color:var(--cream)"><input type="checkbox" class="wd" value="'+d[0]+'" '+(wd.indexOf(d[0])>=0?"checked":"")+'> '+d[1]+'</label>';}).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 22px">Configurações</h1>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">Dados do salão</h2>'+
      '<div class="grid-2">'+f("salon_name","Nome")+f("salon_tagline","Slogan")+f("salon_phone","Telefone")+
      f("salon_whatsapp","WhatsApp (5514...)")+f("salon_address","Endereço")+f("salon_instagram","Instagram (sem @)")+'</div></div>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">Horário de funcionamento</h2>'+
      '<div class="grid-2">'+f("open_time","Abre (HH:MM)","09:00")+f("close_time","Fecha (HH:MM)","18:00")+
      f("slot_interval","Intervalo entre horários (min)","30")+f("capacity","Atendimentos simultâneos","1")+'</div>'+
      '<div class="field"><label>Dias de atendimento</label><div>'+dayboxes+'</div></div></div>'+
      '<button class="btn btn-gold" id="cfg_save">Salvar configurações</button> <span class="muted" id="cfg_msg" style="margin-left:10px"></span>';
    el("cfg_save").addEventListener("click", async function(){
      var keys=["salon_name","salon_tagline","salon_phone","salon_whatsapp","salon_address","salon_instagram","open_time","close_time","slot_interval","capacity"];
      var rows=keys.map(function(k){ return {key:k, value:(el("cfg_"+k).value||"").trim()}; });
      var wds=[]; pane.querySelectorAll(".wd:checked").forEach(function(c){ wds.push(c.value); });
      rows.push({key:"work_days", value:wds.join(",")});
      var { error } = await db.from("settings").upsert(rows);
      el("cfg_msg").textContent = error ? "Erro ao salvar." : "Salvo! ✓";
    });
  }

  // ---------- AVALIAÇÕES ----------
  var editRevId=null;
  async function renderAvaliacoes(){
    var pane=el("pane-avaliacoes");
    var cfg=(await db.from("settings").select("*")).data||[];
    var m={}; cfg.forEach(function(r){ m[r.key]=r.value; });
    var revs=(await db.from("reviews").select("*").order("sort_order").order("created_at",{ascending:false})).data||[];
    var ed = editRevId ? revs.filter(function(r){return r.id===editRevId;})[0] : null;
    function starsTxt(n){ n=parseInt(n)||0; var s=""; for(var i=0;i<5;i++)s+=i<n?"★":"☆"; return s; }
    var rows=revs.map(function(r){
      return '<tr><td>'+r.sort_order+'</td><td><b>'+esc(r.author_name)+'</b>'+(r.date_label?'<br><span class="muted" style="font-size:.78rem">'+esc(r.date_label)+'</span>':'')+'</td>'+
        '<td style="color:var(--gold);white-space:nowrap">'+starsTxt(r.rating)+'</td>'+
        '<td><span class="muted" style="font-size:.85rem">'+esc((r.comment||"").slice(0,80))+((r.comment||"").length>80?"…":"")+'</span></td>'+
        '<td>'+(r.approved?'<span class="badge b-confirmado">No site</span>':'<span class="badge b-cancelado">Oculta</span>')+'</td>'+
        '<td><div class="row-actions">'+
        '<button class="btn btn-sm" data-toggr="'+r.id+'" data-ap="'+(r.approved?0:1)+'">'+(r.approved?"Ocultar":"Mostrar")+'</button>'+
        '<button class="btn btn-sm" data-edr="'+r.id+'">Editar</button>'+
        '<button class="btn btn-sm" data-delr="'+r.id+'">Excluir</button></div></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Avaliações</h1>'+
      '<p class="muted" style="margin:0 0 22px">Mostre as avaliações do Google na página inicial. O botão “Avaliar no Google” leva o cliente direto pro seu perfil.</p>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">Nota do Google (aparece no resumo)</h2>'+
      '<div class="grid-2"><div class="field"><label>Nota (ex.: 4.6)</label><input id="g_rating" value="'+esc(m.google_rating||"")+'" placeholder="4.6"></div>'+
      '<div class="field"><label>Nº de avaliações</label><input id="g_count" value="'+esc(m.google_count||"")+'" placeholder="9"></div></div>'+
      '<div class="field"><label>Link do Google (botão “Avaliar no Google”)</label><input id="g_url" value="'+esc(m.google_url||"")+'" placeholder="https://g.page/... ou link do seu perfil"></div>'+
      '<button class="btn btn-gold" id="g_save">Salvar nota do Google</button> <span class="muted" id="g_msg" style="margin-left:10px"></span></div>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">'+(ed?"Editar avaliação":"Adicionar avaliação")+'</h2>'+
      '<div class="grid-2"><div class="field"><label>Nome do cliente</label><input id="r_name" value="'+esc(ed?ed.author_name:"")+'"></div>'+
      '<div class="field"><label>Estrelas (1 a 5)</label><input id="r_rating" type="number" min="1" max="5" value="'+(ed?ed.rating:5)+'"></div></div>'+
      '<div class="field"><label>Comentário</label><textarea id="r_comment" rows="3" style="width:100%">'+esc(ed?ed.comment:"")+'</textarea></div>'+
      '<div class="grid-2"><div class="field"><label>Quando (ex.: há 3 meses)</label><input id="r_when" value="'+esc(ed?ed.date_label:"")+'" placeholder="há 3 meses"></div>'+
      '<div class="field"><label>Ordem</label><input id="r_ord" type="number" value="'+(ed?ed.sort_order:0)+'"></div></div>'+
      '<div class="field"><label style="color:var(--cream)"><input type="checkbox" id="r_ap" '+(!ed||ed.approved?"checked":"")+'> Mostrar no site</label></div>'+
      '<button class="btn btn-gold" id="r_save">'+(ed?"Salvar":"Adicionar")+'</button> '+(ed?'<button class="btn btn-ghost" id="r_cancel">Cancelar</button>':'')+'</div>'+
      '<div class="panel" style="max-width:none"><table><thead><tr><th>Ordem</th><th>Cliente</th><th>Nota</th><th>Comentário</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
      (revs.length?rows:'<tr><td colspan="6" class="muted center">Nenhuma avaliação ainda.</td></tr>')+'</tbody></table></div>';

    el("g_save").addEventListener("click", async function(){
      var rows2=[{key:"google_rating",value:(el("g_rating").value||"").trim()},
                 {key:"google_count",value:(el("g_count").value||"").trim()},
                 {key:"google_url",value:(el("g_url").value||"").trim()}];
      var { error }=await db.from("settings").upsert(rows2);
      el("g_msg").textContent = error ? "Erro ao salvar." : "Salvo! ✓";
    });
    el("r_save").addEventListener("click", async function(){
      var rt=parseInt(el("r_rating").value)||5; if(rt<1)rt=1; if(rt>5)rt=5;
      var payload={author_name:(el("r_name").value||"").trim(), rating:rt,
        comment:(el("r_comment").value||"").trim(), date_label:(el("r_when").value||"").trim(),
        sort_order:parseInt(el("r_ord").value)||0, approved:el("r_ap").checked, source:(ed?ed.source:"google")};
      if(payload.author_name.length<2){ alert("Informe o nome do cliente."); return; }
      if(ed){ await db.from("reviews").update(payload).eq("id",ed.id); } else { await db.from("reviews").insert(payload); }
      editRevId=null; renderAvaliacoes();
    });
    if(el("r_cancel")) el("r_cancel").addEventListener("click",function(){ editRevId=null; renderAvaliacoes(); });
    pane.querySelectorAll("[data-toggr]").forEach(function(b){ b.addEventListener("click", async function(){ b.disabled=true; await db.from("reviews").update({approved:b.dataset.ap==="1"}).eq("id",b.dataset.toggr); renderAvaliacoes(); }); });
    pane.querySelectorAll("[data-edr]").forEach(function(b){ b.addEventListener("click",function(){ editRevId=b.dataset.edr; renderAvaliacoes(); window.scrollTo({top:0,behavior:"smooth"}); }); });
    pane.querySelectorAll("[data-delr]").forEach(function(b){ b.addEventListener("click", async function(){ if(!confirm("Excluir esta avaliação?"))return; await db.from("reviews").delete().eq("id",b.dataset.delr); renderAvaliacoes(); }); });
  }

  // ---------- PROFISSIONAIS ----------
  var editProId=null;
  async function renderProfissionais(){
    var pane=el("pane-profissionais");
    var { data } = await db.from("professionals").select("*").order("sort_order");
    data=data||[];
    var ed = editProId ? data.filter(function(p){return p.id===editProId;})[0] : null;
    var rows=data.map(function(p){
      return '<tr><td>'+p.sort_order+'</td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.role||"")+'</td>'+
        '<td>'+(p.active?'<span class="badge b-confirmado">Ativo</span>':'<span class="badge b-cancelado">Inativo</span>')+'</td>'+
        '<td><div class="row-actions"><button class="btn btn-sm" data-edp="'+p.id+'">Editar</button>'+
        '<button class="btn btn-sm" data-delp="'+p.id+'">Excluir</button></div></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Profissionais</h1>'+
      '<p class="muted" style="margin:0 0 22px">Quem atende no salão. Cada profissional tem a própria agenda; o cliente escolhe na hora de agendar.</p>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">'+(ed?"Editar profissional":"Novo profissional")+'</h2>'+
      '<div class="grid g2"><div class="field"><label>Nome</label><input id="p_name" value="'+esc(ed?ed.name:"")+'"></div>'+
      '<div class="field"><label>Função (opcional)</label><input id="p_role" value="'+esc(ed?ed.role:"")+'" placeholder="Cabeleireiro(a), Barbeiro..."></div></div>'+
      '<div class="field"><label>Ordem</label><input id="p_ord" type="number" value="'+(ed?ed.sort_order:0)+'"></div>'+
      '<button class="btn btn-gold" id="p_save">'+(ed?"Salvar":"Adicionar")+'</button> '+(ed?'<button class="btn btn-ghost" id="p_cancel">Cancelar</button>':'')+'</div>'+
      '<div class="panel" style="max-width:none"><table><thead><tr><th>Ordem</th><th>Nome</th><th>Função</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
      (data.length?rows:'<tr><td colspan="5" class="muted center">Nenhum profissional ainda.</td></tr>')+'</tbody></table></div>';

    el("p_save").addEventListener("click", async function(){
      var payload={name:(el("p_name").value||"").trim(), role:(el("p_role").value||"").trim(),
        sort_order:parseInt(el("p_ord").value)||0, active:(ed?ed.active:true)};
      if(payload.name.length<2){ alert("Informe o nome."); return; }
      if(ed){ await db.from("professionals").update(payload).eq("id",ed.id); } else { await db.from("professionals").insert(payload); }
      editProId=null; renderProfissionais();
    });
    if(el("p_cancel")) el("p_cancel").addEventListener("click",function(){ editProId=null; renderProfissionais(); });
    pane.querySelectorAll("[data-edp]").forEach(function(b){ b.addEventListener("click",function(){ editProId=b.dataset.edp; renderProfissionais(); window.scrollTo({top:0,behavior:"smooth"}); }); });
    pane.querySelectorAll("[data-delp]").forEach(function(b){ b.addEventListener("click", async function(){ if(!confirm("Excluir este profissional? Os agendamentos dele ficam sem profissional."))return; await db.from("professionals").delete().eq("id",b.dataset.delp); renderProfissionais(); }); });
  }

  // ---------- RELATORIOS ----------
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  async function renderRelatorios(){
    var pane=el("pane-relatorios");
    var now=new Date();
    var start=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-01";
    var nx=new Date(now.getFullYear(), now.getMonth()+1, 1);
    var next=nx.getFullYear()+"-"+String(nx.getMonth()+1).padStart(2,"0")+"-01";
    var mesNome=now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

    var { data } = await db.from("appointments")
      .select("appt_date,status, services(name,price), professionals(name)")
      .gte("appt_date",start).lt("appt_date",next);
    data=data||[];

    var ativos=data.filter(function(a){return a.status!=="cancelado";});
    var concl=data.filter(function(a){return a.status==="concluido";});
    var canc=data.filter(function(a){return a.status==="cancelado";});
    var fatReal=concl.reduce(function(s,a){return s+(a.services?Number(a.services.price):0);},0);
    var fatPrev=ativos.reduce(function(s,a){return s+(a.services?Number(a.services.price):0);},0);

    var porServ={}, porProf={};
    ativos.forEach(function(a){
      var sn=a.services?a.services.name:"—"; porServ[sn]=(porServ[sn]||0)+1;
      var pn=a.professionals?a.professionals.name:"—";
      if(!porProf[pn]) porProf[pn]={n:0,fat:0};
      porProf[pn].n++; if(a.status==="concluido") porProf[pn].fat+=(a.services?Number(a.services.price):0);
    });
    var servRows=Object.keys(porServ).sort(function(a,b){return porServ[b]-porServ[a];})
      .map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+porServ[k]+'</td></tr>';}).join("") || '<tr><td colspan="2" class="muted center">Sem dados no mês.</td></tr>';
    var profRows=Object.keys(porProf).sort(function(a,b){return porProf[b].n-porProf[a].n;})
      .map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+porProf[k].n+'</td><td>'+TR.money(porProf[k].fat)+'</td></tr>';}).join("") || '<tr><td colspan="3" class="muted center">Sem dados no mês.</td></tr>';
    var taxa = data.length ? Math.round(concl.length/data.length*100) : 0;

    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Relatórios</h1>'+
      '<p class="muted" style="margin:0 0 22px;text-transform:capitalize">'+esc(mesNome)+'</p>'+
      '<div class="stat-row">'+
        '<div class="stat"><b>'+TR.money(fatReal)+'</b><span>Faturamento realizado (concluídos)</span></div>'+
        '<div class="stat"><b>'+TR.money(fatPrev)+'</b><span>Previsto (agendados no mês)</span></div>'+
        '<div class="stat"><b>'+ativos.length+'</b><span>Atendimentos no mês</span></div>'+
        '<div class="stat"><b>'+concl.length+'</b><span>Concluídos</span></div>'+
        '<div class="stat"><b>'+canc.length+'</b><span>Cancelados</span></div>'+
        '<div class="stat"><b>'+taxa+'%</b><span>Taxa de conclusão</span></div>'+
      '</div>'+
      '<div class="grid g2">'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Serviços mais agendados</h2>'+
          '<table><thead><tr><th>Serviço</th><th>Qtd</th></tr></thead><tbody>'+servRows+'</tbody></table></div>'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Por profissional</h2>'+
          '<table><thead><tr><th>Profissional</th><th>Atend.</th><th>Faturado</th></tr></thead><tbody>'+profRows+'</tbody></table></div>'+
      '</div>';
  }

  // ---------- BLOQUEIOS (folgas / feriados) ----------
  async function renderBloqueios(){
    var pane=el("pane-bloqueios");
    var pros=(await db.from("professionals").select("*").eq("active",true).order("sort_order")).data||[];
    var today=(function(){var d=new Date();var o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10);})();
    var { data } = await db.from("blocked_slots").select("*, professionals(name)").gte("block_date",today).order("block_date");
    data=data||[];
    var proOpts='<option value="">Todos os profissionais</option>'+pros.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");
    var rows=data.map(function(b){
      return '<tr><td><b>'+esc(brDate(b.block_date))+'</b></td>'+
        '<td>'+(b.block_time?esc(b.block_time.slice(0,5)):'<span class="muted">Dia inteiro</span>')+'</td>'+
        '<td>'+(b.professionals?esc(b.professionals.name):'<span class="muted">Todos</span>')+'</td>'+
        '<td>'+esc(b.reason||"")+'</td>'+
        '<td><button class="btn btn-sm btn-danger" data-delb="'+b.id+'">Remover</button></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Bloqueios de agenda</h1>'+
      '<p class="muted" style="margin:0 0 22px">Folgas, feriados ou intervalos. Horário bloqueado some da agenda pros clientes.</p>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">Novo bloqueio</h2>'+
      '<div class="grid g4">'+
        '<div class="field"><label>Data</label><input type="date" id="b_date" min="'+today+'"></div>'+
        '<div class="field"><label>Horário (vazio = dia inteiro)</label><input type="time" id="b_time"></div>'+
        '<div class="field"><label>Profissional</label><select id="b_pro">'+proOpts+'</select></div>'+
        '<div class="field"><label>Motivo (opcional)</label><input id="b_reason" placeholder="Folga, feriado..."></div>'+
      '</div><button class="btn btn-gold" id="b_save">Adicionar bloqueio</button> <span class="muted" id="b_msg" style="margin-left:10px"></span></div>'+
      '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Próximos bloqueios</h2>'+
      '<table><thead><tr><th>Data</th><th>Horário</th><th>Profissional</th><th>Motivo</th><th></th></tr></thead><tbody>'+
      (data.length?rows:'<tr><td colspan="5" class="muted center">Nenhum bloqueio.</td></tr>')+'</tbody></table></div>';

    el("b_save").addEventListener("click", async function(){
      var d=el("b_date").value; if(!d){ el("b_msg").textContent="Escolha a data."; return; }
      var payload={ block_date:d, block_time:(el("b_time").value||null), professional_id:(el("b_pro").value||null), reason:(el("b_reason").value||"").trim() };
      el("b_save").disabled=true;
      var { error } = await db.from("blocked_slots").insert(payload);
      el("b_save").disabled=false;
      if(error){ el("b_msg").textContent="Erro ao salvar."; return; }
      renderBloqueios();
    });
    pane.querySelectorAll("[data-delb]").forEach(function(b){ b.addEventListener("click", async function(){ await db.from("blocked_slots").delete().eq("id",b.dataset.delb); renderBloqueios(); }); });
  }

  gate();
})();
</script>
</body>
</html>
