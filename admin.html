<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — TR Atelier</title>
<link rel="icon" href="assets/icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="admin-top">
  <div class="container">
    <span class="brand"><b>✦ TR Atelier</b></span>
    <nav id="tabs" class="hidden">
      <a data-tab="agenda" class="on">Agenda</a>
      <a data-tab="relatorios">Relatórios</a>
      <a data-tab="clientes">Clientes</a>
      <a data-tab="profissionais">Profissionais</a>
      <a data-tab="bloqueios">Bloqueios</a>
      <a data-tab="avaliacoes">Avaliações</a>
      <a data-tab="servicos">Serviços & Preços</a>
      <a data-tab="orcamentos">Orçamentos</a>
      <a data-tab="config">Configurações</a>
      <a href="index.html" target="_blank">Ver site ↗</a>
    </nav>
    <a href="#" id="logout" class="muted" style="margin-left:auto;font-size:.86rem">Sair →</a>
  </div>
</header>

<div class="container" style="padding:28px 24px 70px">
  <div id="gate"><p class="muted">Carregando…</p></div>
  <div id="app" class="hidden">
    <div class="tabpane on" id="pane-agenda"></div>
    <div class="tabpane" id="pane-relatorios"></div>
    <div class="tabpane" id="pane-clientes"></div>
    <div class="tabpane" id="pane-profissionais"></div>
    <div class="tabpane" id="pane-bloqueios"></div>
    <div class="tabpane" id="pane-avaliacoes"></div>
    <div class="tabpane" id="pane-servicos"></div>
    <div class="tabpane" id="pane-orcamentos"></div>
    <div class="tabpane" id="pane-config"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<script src="assets/config.js"></script>
<script src="assets/main.js"></script>
<script>
(function(){
  "use strict";
  var TR=window.TR, db=TR.db;
  var currentUserId=null;
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var badge={pendente:"b-pendente",confirmado:"b-confirmado",concluido:"b-concluido",cancelado:"b-cancelado",faltou:"b-faltou",novo:"b-novo",respondido:"b-confirmado",fechado:"b-concluido"};
  var brDate=function(d){return d?d.split("-").reverse().join("/"):"";};

  el("logout").addEventListener("click", async function(e){ e.preventDefault(); if(db) await db.auth.signOut(); location.href="index.html"; });

  // ---------- GATE ----------
  async function gate(){
    if(!TR.configured){ el("gate").innerHTML='<div class="panel"><p class="muted">Conecte o Supabase em <b>assets/config.js</b> para usar o painel.</p></div>'; return; }
    var user=await TR.getUser();
    if(user) currentUserId=user.id;
    if(!user){
      el("gate").innerHTML='<div class="panel" style="max-width:420px"><h2 style="font-family:var(--serif);color:var(--gold);margin-top:0">Área do salão</h2>'+
        '<p class="muted">Entre com email e senha para acessar o painel.</p>'+
        '<div class="field" style="margin-top:12px"><label>Email</label><input id="ae" type="email" placeholder="seu@email.com"></div>'+
        '<div class="field"><label>Senha</label><input id="ap" type="password" placeholder="mín. 6 caracteres"></div>'+
        '<button class="btn btn-gold btn-block" id="ain">Entrar</button>'+
        '<button class="btn btn-ghost btn-block" id="aup" style="margin-top:10px">Criar conta (1ª vez)</button>'+
        '<p class="muted" id="amsg" style="font-size:.84rem;margin-top:10px"></p></div>';
      var creds=function(){ return { email:(el("ae").value||"").trim(), password:(el("ap").value||"") }; };
      var valid=function(c){ return /.+@.+\..+/.test(c.email) && c.password.length>=6; };
      el("ain").addEventListener("click", async function(){
        var c=creds(); if(!valid(c)){ el("amsg").textContent="Preencha email e senha (mín. 6)."; return; }
        el("ain").disabled=true; var r=await db.auth.signInWithPassword(c); el("ain").disabled=false;
        if(r.error){ el("amsg").textContent="Email ou senha incorretos."; } else { location.reload(); }
      });
      el("aup").addEventListener("click", async function(){
        var c=creds(); if(!valid(c)){ el("amsg").textContent="Preencha email e senha (mín. 6)."; return; }
        el("aup").disabled=true; var r=await db.auth.signUp(c); el("aup").disabled=false;
        if(r.error){ el("amsg").textContent="Erro: "+(r.error.message||"tente outro email"); }
        else if(r.data && r.data.session){ location.reload(); }
        else { el("amsg").textContent="Conta criada! Se pedir confirmação por email, desative 'Confirm email' no Supabase (Authentication → Sign In / Providers → Email) e clique em Entrar."; }
      });
      return;
    }
    var { data:isAdmin } = await db.rpc("is_admin");
    if(!isAdmin){
      el("gate").innerHTML='<div class="panel" style="max-width:520px"><h2 style="font-family:var(--serif);color:var(--gold);margin-top:0">Sem permissão</h2>'+
        '<p class="muted">Esta conta ('+esc(user.email)+') ainda não é administradora.<br><br>Peça para um administrador atual aprovar seu acesso no painel, em <b>Configurações → Administradores</b>. Depois recarregue esta página.</p>'+
        '<button class="btn btn-ghost" id="out">Trocar de conta</button></div>';
      el("out").addEventListener("click", async function(){ await db.auth.signOut(); location.reload(); });
      return;
    }
    el("gate").classList.add("hidden"); el("app").classList.remove("hidden"); el("tabs").classList.remove("hidden");
    setupTabs(); renderAgenda(); renderRelatorios(); renderClientes(); renderProfissionais(); renderBloqueios(); renderAvaliacoes(); renderServicos(); renderOrcamentos(); renderConfig();
  }

  function setupTabs(){
    el("tabs").querySelectorAll("[data-tab]").forEach(function(a){
      a.addEventListener("click",function(e){ e.preventDefault();
        el("tabs").querySelectorAll("[data-tab]").forEach(function(x){x.classList.remove("on");});
        a.classList.add("on");
        document.querySelectorAll(".tabpane").forEach(function(p){p.classList.remove("on");});
        el("pane-"+a.dataset.tab).classList.add("on");
      });
    });
  }

  // ---------- AGENDA ----------
  var agView="todos", agPro="", agHideCancel=false, agNew=false, agTrash=false;
  function manageLink(a){
    if(!a.manage_token) return "";
    return location.origin+"/gerenciar.html?id="+a.id+"&t="+a.manage_token;
  }
  function waMsg(a, salon){
    var d=brDate(a.appt_date), h=(a.appt_time||"").slice(0,5), s=a.services?a.services.name:"seu horário";
    var link=manageLink(a);
    return "Olá "+(a.customer_name||"")+"! Passando pra confirmar seu horário no "+(salon||"salão")+": "+s+
           " — "+d+" às "+h+". Se precisar remarcar ou cancelar, acesse: "+link+"\n\nQualquer coisa, é só me chamar por aqui. 😊";
  }
  async function renderAgenda(){
    var pane=el("pane-agenda");
    var today=new Date(); var off=today.getTimezoneOffset()*60000;
    var todayStr=new Date(today-off).toISOString().slice(0,10);
    var weekEnd=new Date(today.getTime()+6*86400000-off).toISOString().slice(0,10);
    var cfg=(await db.from("settings").select("*")).data||[]; var cm={}; cfg.forEach(function(r){cm[r.key]=r.value;});
    var salon=cm.salon_name||"TR Atelier";
    var pros=(await db.from("professionals").select("*").eq("active",true).order("sort_order")).data||[];
    var servs=(await db.from("services").select("*").eq("active",true).order("sort_order")).data||[];
    var { data, error } = await db.from("appointments").select("*, services(name), professionals(name)").is("deleted_at",null).order("appt_date").order("appt_time");
    if(error){ pane.innerHTML='<div class="panel"><p class="muted">Erro ao carregar agenda.</p></div>'; return; }
    var trashData=[];
    if(agTrash){
      trashData=(await db.from("appointments").select("*, services(name), professionals(name)").not("deleted_at","is",null).order("deleted_at",{ascending:false})).data||[];
    }

    var todayCount=data.filter(function(a){return a.appt_date===todayStr && a.status!=="cancelado";}).length;
    var pend=data.filter(function(a){return a.status==="pendente";}).length;
    var upc=data.filter(function(a){return a.appt_date>=todayStr && (a.status==="pendente"||a.status==="confirmado");}).length;

    var view=data.filter(function(a){
      if(agView==="hoje" && a.appt_date!==todayStr) return false;
      if(agView==="semana" && (a.appt_date<todayStr || a.appt_date>weekEnd)) return false;
      if(agPro && a.professional_id!==agPro) return false;
      if(agHideCancel && a.status==="cancelado") return false;
      return true;
    });
    var viewPend = view.filter(function(a){return a.status==="pendente";});
    var viewFila = view.filter(function(a){return a.status!=="pendente";});

    function rowFor(a){
      var wa=(a.customer_phone||"").replace(/\D/g,"");
      var acts="";
      if(a.status==="pendente") acts+='<button class="btn btn-sm btn-gold" data-act="confirmado" data-id="'+a.id+'">Confirmar</button>';
      if(a.status==="pendente"||a.status==="confirmado"){
        acts+='<a class="btn btn-sm" href="https://wa.me/55'+wa+'?text='+encodeURIComponent(waMsg(a,salon))+'" target="_blank" title="Enviar confirmação/lembrete no WhatsApp">💬 Lembrar</a>';
        acts+='<button class="btn btn-sm" data-act="concluido" data-id="'+a.id+'">Concluir</button>';
        acts+='<button class="btn btn-sm" data-act="faltou" data-id="'+a.id+'">Faltou</button>';
        acts+='<button class="btn btn-sm" data-act="cancelado" data-id="'+a.id+'">Cancelar</button>';
      }
      acts+='<button class="btn btn-sm btn-danger" data-delap="'+a.id+'" title="Excluir (vai pra lixeira, dá pra restaurar)">🗑 Excluir</button>';
      var srch=((a.customer_name||"")+" "+(a.customer_phone||"")).toLowerCase();
      return '<tr data-search="'+esc(srch)+'"><td><b>'+brDate(a.appt_date)+'</b><br><span class="muted">'+a.appt_time.slice(0,5)+'</span></td>'+
        '<td>'+esc(a.customer_name)+(a.notes?'<br><span class="muted" style="font-size:.8rem">“'+esc(a.notes)+'”</span>':'')+'</td>'+
        '<td>'+esc(a.services?a.services.name:"")+(a.professionals?'<br><span class="muted" style="font-size:.8rem">👤 '+esc(a.professionals.name)+'</span>':"")+'</td>'+
        '<td><a href="https://wa.me/55'+wa+'" target="_blank" style="color:var(--gold)">'+esc(a.customer_phone)+'</a></td>'+
        '<td><span class="badge '+(badge[a.status]||"")+'">'+a.status+'</span></td>'+
        '<td><div class="row-actions">'+acts+'</div></td></tr>';
    }
    var pendRows=viewPend.map(rowFor).join("");
    var rows=viewFila.map(rowFor).join("");
    var trashRows=trashData.map(function(a){
      var when=a.deleted_at?new Date(a.deleted_at).toLocaleString("pt-BR"):"";
      return '<tr><td><b>'+brDate(a.appt_date)+'</b><br><span class="muted">'+a.appt_time.slice(0,5)+'</span></td>'+
        '<td>'+esc(a.customer_name)+'</td>'+
        '<td>'+esc(a.services?a.services.name:"")+(a.professionals?'<br><span class="muted" style="font-size:.8rem">👤 '+esc(a.professionals.name)+'</span>':"")+'</td>'+
        '<td><span class="badge '+(badge[a.status]||"")+'">'+a.status+'</span></td>'+
        '<td class="muted" style="font-size:.8rem">'+esc(when)+'</td>'+
        '<td><button class="btn btn-sm btn-gold" data-restap="'+a.id+'">↩ Restaurar</button></td></tr>';
    }).join("");

    // controles
    function vbtn(k,txt){ return '<button class="btn btn-sm '+(agView===k?"btn-gold":"")+'" data-view="'+k+'">'+txt+'</button>'; }
    var proOpts='<option value="">Todos os profissionais</option>'+pros.map(function(p){return '<option value="'+p.id+'"'+(agPro===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");
    var controls='<div class="ag-controls">'+
      '<div class="ag-views">'+vbtn("hoje","Hoje")+vbtn("semana","Semana")+vbtn("todos","Todos")+'</div>'+
      '<select id="ag_pro" class="ag-sel">'+proOpts+'</select>'+
      '<input id="ag_search" class="ag-search" type="search" placeholder="Buscar por nome ou telefone…">'+
      '<label class="ag-chk"><input type="checkbox" id="ag_hide" '+(agHideCancel?"checked":"")+'> Ocultar cancelados</label>'+
      '<button class="btn btn-sm" id="ag_trashbtn">'+(agTrash?"Fechar lixeira":"🗑 Lixeira")+'</button>'+
      '<button class="btn btn-sm btn-gold" id="ag_newbtn">'+(agNew?"Fechar":"+ Novo agendamento")+'</button></div>';

    // form novo agendamento
    var newForm="";
    if(agNew){
      var sOpts=servs.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+' — '+TR.money(s.price)+'</option>';}).join("");
      var pOpts='<option value="">Sem preferência</option>'+pros.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");
      newForm='<div class="panel" style="max-width:none;margin-bottom:18px"><h2 style="font-family:var(--serif);margin-top:0">Novo agendamento (manual)</h2>'+
        '<div class="grid-2"><div class="field"><label>Cliente</label><input id="na_name"></div>'+
        '<div class="field"><label>WhatsApp</label><input id="na_phone" type="tel" placeholder="(14) 99999-9999"></div></div>'+
        '<div class="grid-2"><div class="field"><label>Serviço</label><select id="na_serv">'+sOpts+'</select></div>'+
        '<div class="field"><label>Profissional</label><select id="na_pro">'+pOpts+'</select></div></div>'+
        '<div class="grid-2"><div class="field"><label>Data</label><input id="na_date" type="date" value="'+todayStr+'"></div>'+
        '<div class="field"><label>Horário</label>'+
          '<select id="na_time"><option value="">Escolha serviço e data…</option></select>'+
          '<input id="na_time_free" type="time" value="09:00" style="display:none">'+
          '<label class="ag-chk" style="margin-top:8px"><input type="checkbox" id="na_force"> Encaixar fora da lista (forçar horário)</label>'+
        '</div></div>'+
        '<div class="field"><label>Observações (opcional)</label><input id="na_notes"></div>'+
        '<button class="btn btn-gold" id="na_save">Lançar agendamento</button> <span class="muted" id="na_msg" style="margin-left:10px"></span></div>';
    }

    var pendPanel = viewPend.length
      ? '<div class="panel" style="max-width:none;margin-bottom:18px;border:1px solid var(--gold)"><h2 style="font-family:var(--serif);margin-top:0;color:var(--gold)">⏳ Aguardando confirmação ('+viewPend.length+')</h2>'+
        '<p class="muted" style="margin:0 0 14px;font-size:.85rem">Agendamentos que o cliente acabou de marcar. Confirme para o horário entrar na fila normal da agenda.</p>'+
        '<div class="table-wrap"><table><thead><tr><th>Data/Hora</th><th>Cliente</th><th>Serviço</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead><tbody id="ag_pend_body">'+pendRows+'</tbody></table></div></div>'
      : '';

    var trashPanel = agTrash
      ? '<div class="panel" style="max-width:none;margin-bottom:18px"><h2 style="font-family:var(--serif);margin-top:0">🗑 Lixeira ('+trashData.length+')</h2>'+
        '<p class="muted" style="margin:0 0 14px;font-size:.85rem">Agendamentos excluídos. Dá pra restaurar a qualquer momento.</p>'+
        '<div class="table-wrap">'+(trashData.length?'<table><thead><tr><th>Data/Hora</th><th>Cliente</th><th>Serviço</th><th>Status</th><th>Excluído em</th><th></th></tr></thead><tbody id="ag_trash_body">'+trashRows+'</tbody></table>':'<p class="muted center">Lixeira vazia.</p>')+'</div></div>'
      : '';

    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 4px">Agenda</h1>'+
      '<p class="muted" style="margin:0 0 20px">Gerencie os agendamentos em tempo real.</p>'+
      '<div class="stat-row"><div class="stat"><b>'+todayCount+'</b><span>Hoje</span></div>'+
      '<div class="stat"><b>'+pend+'</b><span>Aguardando confirmação</span></div>'+
      '<div class="stat"><b>'+upc+'</b><span>Próximos ativos</span></div>'+
      '<div class="stat"><b>'+data.length+'</b><span>Total</span></div></div>'+
      controls+newForm+trashPanel+pendPanel+
      '<div class="panel" style="max-width:none"><div class="table-wrap">'+
      (viewFila.length?'<table><thead><tr><th>Data/Hora</th><th>Cliente</th><th>Serviço</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead><tbody id="ag_body">'+rows+'</tbody></table>':'<p class="muted center">Nenhum agendamento confirmado para este filtro.</p>')+
      '</div></div>';

    // handlers de status
    pane.querySelectorAll("[data-act]").forEach(function(b){
      b.addEventListener("click", async function(){ b.disabled=true;
        await db.from("appointments").update({status:b.dataset.act}).eq("id",b.dataset.id); renderAgenda(); renderRelatorios(); renderOrcamentos();
      });
    });
    // excluir (vai pra lixeira)
    pane.querySelectorAll("[data-delap]").forEach(function(b){
      b.addEventListener("click", async function(){
        if(!confirm("Excluir este agendamento? Ele vai pra lixeira e dá pra restaurar depois.")) return;
        b.disabled=true;
        var r=await db.rpc("admin_delete_appointment",{p_id:b.dataset.delap});
        if(r.error || !r.data || !r.data.ok){ alert((r.data&&r.data.error)||"Não foi possível excluir."); b.disabled=false; return; }
        renderAgenda(); renderRelatorios();
      });
    });
    // restaurar da lixeira
    pane.querySelectorAll("[data-restap]").forEach(function(b){
      b.addEventListener("click", async function(){
        b.disabled=true;
        var r=await db.rpc("admin_restore_appointment",{p_id:b.dataset.restap});
        if(r.error || !r.data || !r.data.ok){ alert((r.data&&r.data.error)||"Não foi possível restaurar."); b.disabled=false; return; }
        renderAgenda(); renderRelatorios();
      });
    });
    // filtros
    pane.querySelectorAll("[data-view]").forEach(function(b){ b.addEventListener("click",function(){ agView=b.dataset.view; renderAgenda(); }); });
    el("ag_pro").addEventListener("change",function(){ agPro=el("ag_pro").value; renderAgenda(); });
    el("ag_hide").addEventListener("change",function(){ agHideCancel=el("ag_hide").checked; renderAgenda(); });
    el("ag_newbtn").addEventListener("click",function(){ agNew=!agNew; renderAgenda(); });
    el("ag_trashbtn").addEventListener("click",function(){ agTrash=!agTrash; renderAgenda(); });
    // busca ao vivo (sem recarregar)
    var si=el("ag_search");
    if(si) si.addEventListener("input",function(){
      var q=si.value.toLowerCase().trim(); var qd=q.replace(/\D/g,"");
      pane.querySelectorAll("#ag_body tr, #ag_pend_body tr").forEach(function(tr){
        var s=tr.getAttribute("data-search")||"";
        var hit = !q || s.indexOf(q)>=0 || (qd && s.replace(/\D/g,"").indexOf(qd)>=0);
        tr.style.display = hit ? "" : "none";
      });
    });
    // agendamento manual: carregar horários realmente livres
    async function loadManualSlots(){
      if(!agNew || !el("na_time")) return;
      var force=el("na_force") && el("na_force").checked;
      el("na_time").style.display = force ? "none" : "";
      el("na_time_free").style.display = force ? "" : "none";
      if(force) return;
      var sel=el("na_time"), sv=el("na_serv").value, dt=el("na_date").value, pr=el("na_pro").value||null;
      sel.innerHTML='<option value="">Carregando…</option>';
      if(!sv||!dt){ sel.innerHTML='<option value="">Escolha serviço e data…</option>'; return; }
      var r=await db.rpc("get_available_slots",{ p_service_id:sv, p_date:dt, p_professional_id:pr });
      var slots=(r&&r.data)||[];
      if(r.error || !slots.length){ sel.innerHTML='<option value="">Nenhum horário livre nesse dia</option>'; return; }
      sel.innerHTML=slots.map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join("");
    }
    if(agNew && el("na_serv")){
      ["na_serv","na_date","na_pro"].forEach(function(id){ el(id).addEventListener("change",loadManualSlots); });
      if(el("na_force")) el("na_force").addEventListener("change",loadManualSlots);
      loadManualSlots();
    }
    // salvar novo agendamento
    if(agNew && el("na_save")) el("na_save").addEventListener("click", async function(){
      var msg=el("na_msg"); var force=el("na_force")&&el("na_force").checked;
      var time = force ? el("na_time_free").value : el("na_time").value;
      if(!time){ msg.textContent="Selecione um horário disponível (ou marque “forçar”)."; return; }
      el("na_save").disabled=true;
      var r;
      if(force){
        // encaixe manual: cria mesmo fora da lista
        r=await db.rpc("admin_create_appointment",{
          p_service_id:el("na_serv").value, p_professional_id:(el("na_pro").value||null),
          p_name:(el("na_name").value||"").trim(), p_phone:(el("na_phone").value||"").trim(),
          p_date:el("na_date").value, p_time:time, p_status:"confirmado",
          p_notes:(el("na_notes").value||"").trim() });
      } else {
        // caminho validado: mesma checagem do cliente (sem choque de horário)
        r=await db.rpc("book_appointment",{
          p_service_id:el("na_serv").value, p_name:(el("na_name").value||"").trim(),
          p_phone:(el("na_phone").value||"").trim(), p_date:el("na_date").value, p_time:time,
          p_professional_id:(el("na_pro").value||null), p_email:"", p_notes:(el("na_notes").value||"").trim() });
        if(r&&r.data&&r.data.ok&&r.data.id){ await db.from("appointments").update({status:"confirmado"}).eq("id",r.data.id); }
      }
      el("na_save").disabled=false;
      if(r.error || !r.data || !r.data.ok){ msg.textContent=(r.data&&r.data.error)||"Não foi possível lançar."; return; }
      agNew=false; renderAgenda(); renderRelatorios();
    });
  }

  // ---------- SERVIÇOS ----------

  async function loadAdmins(){
    var box=el("adminmgr"); if(!box) return;
    var r=await db.rpc("list_admins");
    if(r.error || !r.data || !r.data.ok){
      box.innerHTML='<div class="panel" style="max-width:none;margin-top:22px"><h2 style="font-family:var(--serif);margin-top:0">Administradores</h2>'+
        '<p class="muted">Recurso não disponível ainda. Rode a <b>migração 5</b> no Supabase para ativar.</p></div>';
      return;
    }
    var d=r.data, ad=d.admins||[], pend=d.pending||[], lim=d.limit||2;
    var adRows=ad.map(function(u){
      var self=u.id===currentUserId;
      return '<tr><td>'+esc(u.email)+'</td>'+
        '<td>'+(self?'<span class="badge b-confirmado">você</span>':'<span class="badge b-confirmado">admin</span>')+'</td>'+
        '<td>'+((!self && ad.length>1)?'<button class="btn btn-sm" data-revoke="'+u.id+'">Remover</button>':'')+'</td></tr>';
    }).join("");
    var canAdd = ad.length < lim;
    var pendRows = pend.map(function(u){
      return '<tr><td>'+esc(u.email)+'</td><td><button class="btn btn-sm btn-gold" data-grant="'+u.id+'">Tornar administrador</button></td></tr>';
    }).join("");
    box.innerHTML='<div class="panel" style="max-width:none;margin-top:22px"><h2 style="font-family:var(--serif);margin-top:0">Administradores ('+ad.length+' de '+lim+')</h2>'+

      '<div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Status</th><th></th></tr></thead><tbody>'+adRows+'</tbody></table></div>'+
      (canAdd

        : '<p class="muted" style="font-size:.86rem">✓ Limite de '+lim+' administradores atingido.</p>')+
      '</div>';
    box.querySelectorAll("[data-grant]").forEach(function(b){ b.addEventListener("click", async function(){ b.disabled=true;
      var rr=await db.rpc("grant_admin",{p_user_id:b.dataset.grant});

    box.querySelectorAll("[data-revoke]").forEach(function(b){ b.addEventListener("click", async function(){ if(!confirm("Remover este administrador?"))return; b.disabled=true;
      var rr=await db.rpc("revoke_admin",{p_user_id:b.dataset.revoke});
      if(rr.error||!rr.data||!rr.data.ok){ alert((rr.data&&rr.data.error)||"Não foi possível."); b.disabled=false; return; } loadAdmins(); }); });
  }

        sort_order:parseInt(el("p_ord").value)||0, active:(ed?ed.active:true)};
      if(payload.name.length<2){ alert("Informe o nome."); return; }
      var selectedServ=[]; pane.querySelectorAll(".p_serv:checked").forEach(function(c){ selectedServ.push(c.value); });
      var proId=ed?ed.id:null;
      if(ed){ await db.from("professionals").update(payload).eq("id",ed.id); }
      else { var ins=await db.from("professionals").insert(payload).select().single(); proId=ins.data&&ins.data.id; }
      if(proId){
        await db.from("professional_services").delete().eq("professional_id",proId);
        if(selectedServ.length){ await db.from("professional_services").insert(selectedServ.map(function(sid){return {professional_id:proId, service_id:sid};})); }
      }
      editProId=null; renderProfissionais();
    });
    if(el("p_cancel")) el("p_cancel").addEventListener("click",function(){ editProId=null; renderProfissionais(); });
    pane.querySelectorAll("[data-edp]").forEach(function(b){ b.addEventListener("click",function(){ editProId=b.dataset.edp; renderProfissionais(); window.scrollTo({top:0,behavior:"smooth"}); }); });
    pane.querySelectorAll("[data-delp]").forEach(function(b){ b.addEventListener("click", async function(){ if(!confirm("Excluir este profissional? Os agendamentos dele ficam sem profissional."))return; await db.from("professionals").delete().eq("id",b.dataset.delp); renderProfissionais(); }); });
  }

  // ---------- RELATORIOS ----------
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var relMode="mes", relStart="", relEnd="";
  async function renderRelatorios(){
    var pane=el("pane-relatorios");
    var now=new Date(); var off=now.getTimezoneOffset()*60000;
    function iso(d){return new Date(d-off).toISOString().slice(0,10);}
    var startD, endExclD, label;
    if(relMode==="mespassado"){ startD=new Date(now.getFullYear(),now.getMonth()-1,1); endExclD=new Date(now.getFullYear(),now.getMonth(),1); label=startD.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
    else if(relMode==="30dias"){ endExclD=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); startD=new Date(now.getFullYear(),now.getMonth(),now.getDate()-29); label="Últimos 30 dias"; }
    else if(relMode==="custom"){
      var s=relStart||iso(new Date(now.getFullYear(),now.getMonth(),1)); var e=relEnd||iso(now);
      startD=new Date(s+"T00:00:00"); endExclD=new Date(new Date(e+"T00:00:00").getTime()+86400000);
      label="Período personalizado";
    } else { relMode="mes"; startD=new Date(now.getFullYear(),now.getMonth(),1); endExclD=new Date(now.getFullYear(),now.getMonth()+1,1); label=now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
    var start=iso(startD), next=iso(endExclD);

    var { data } = await db.from("appointments")
      .select("appt_date,appt_time,customer_name,customer_phone,status, services(name,price), professionals(name)")
      .is("deleted_at",null)
      .gte("appt_date",start).lt("appt_date",next).order("appt_date").order("appt_time");
    data=data||[];

    var ativos=data.filter(function(a){return a.status!=="cancelado" && a.status!=="faltou";});
    var concl=data.filter(function(a){return a.status==="concluido";});
    var canc=data.filter(function(a){return a.status==="cancelado";});
    var faltou=data.filter(function(a){return a.status==="faltou";});
    var fatReal=concl.reduce(function(s,a){return s+(a.services?Number(a.services.price):0);},0);
    var fatPrev=ativos.reduce(function(s,a){return s+(a.services?Number(a.services.price):0);},0);

    var porServ={}, porProf={}, porHora={}, porDia={}; var diasN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    ativos.forEach(function(a){
      var sn=a.services?a.services.name:"—"; porServ[sn]=(porServ[sn]||0)+1;
      var pn=a.professionals?a.professionals.name:"—";
      if(!porProf[pn]) porProf[pn]={n:0,fat:0};
      porProf[pn].n++; if(a.status==="concluido") porProf[pn].fat+=(a.services?Number(a.services.price):0);
      var h=(a.appt_time||"").slice(0,2); if(h) porHora[h]=(porHora[h]||0)+1;
      var dw=new Date(a.appt_date+"T00:00:00").getDay(); porDia[dw]=(porDia[dw]||0)+1;
    });
    function rankRows(obj,fmt,cols){ var ks=Object.keys(obj).sort(function(a,b){return (obj[b].n||obj[b])-(obj[a].n||obj[a]);});
      return ks.length?ks.map(fmt).join(""):'<tr><td colspan="'+cols+'" class="muted center">Sem dados no período.</td></tr>'; }
    var servRows=rankRows(porServ,function(k){return '<tr><td>'+esc(k)+'</td><td>'+porServ[k]+'</td></tr>';},2);
    var profRows=rankRows(porProf,function(k){return '<tr><td>'+esc(k)+'</td><td>'+porProf[k].n+'</td><td>'+TR.money(porProf[k].fat)+'</td></tr>';},3);
    var horaRows=Object.keys(porHora).sort(function(a,b){return porHora[b]-porHora[a];}).slice(0,6)
      .map(function(k){return '<tr><td>'+k+'h</td><td>'+porHora[k]+'</td></tr>';}).join("") || '<tr><td colspan="2" class="muted center">Sem dados.</td></tr>';
    var diaRows=Object.keys(porDia).sort(function(a,b){return porDia[b]-porDia[a];})
      .map(function(k){return '<tr><td>'+diasN[k]+'</td><td>'+porDia[k]+'</td></tr>';}).join("") || '<tr><td colspan="2" class="muted center">Sem dados.</td></tr>';
    var taxa = ativos.length ? Math.round(concl.length/ativos.length*100) : 0;

    function opt(v,t){ return '<option value="'+v+'"'+(relMode===v?" selected":"")+'>'+t+'</option>'; }
    var controls='<div class="ag-controls"><select id="rel_mode" class="ag-sel">'+
      opt("mes","Este mês")+opt("mespassado","Mês passado")+opt("30dias","Últimos 30 dias")+opt("custom","Personalizado")+'</select>'+
      (relMode==="custom"?'<input id="rel_s" type="date" class="ag-sel" value="'+(relStart||start)+'"><input id="rel_e" type="date" class="ag-sel" value="'+(relEnd||iso(now))+'">':'')+
      '<button class="btn btn-sm" id="rel_csv">⬇ Exportar CSV</button></div>';

    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Relatórios</h1>'+
      '<p class="muted" style="margin:0 0 18px;text-transform:capitalize">'+esc(label)+'</p>'+
      controls+
      '<div class="stat-row">'+
        '<div class="stat"><b>'+TR.money(fatReal)+'</b><span>Faturamento realizado (concluídos)</span></div>'+
        '<div class="stat"><b>'+TR.money(fatPrev)+'</b><span>Previsto (agendados ativos)</span></div>'+
        '<div class="stat"><b>'+ativos.length+'</b><span>Atendimentos</span></div>'+
        '<div class="stat"><b>'+concl.length+'</b><span>Concluídos</span></div>'+
        '<div class="stat"><b>'+canc.length+'</b><span>Cancelados</span></div>'+
        '<div class="stat"><b>'+faltou.length+'</b><span>Faltas (no-show)</span></div>'+
        '<div class="stat"><b>'+taxa+'%</b><span>Taxa de conclusão</span></div>'+
      '</div>'+
      '<div class="grid g2">'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Serviços mais agendados</h2>'+
          '<div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Qtd</th></tr></thead><tbody>'+servRows+'</tbody></table></div></div>'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Por profissional</h2>'+
          '<div class="table-wrap"><table><thead><tr><th>Profissional</th><th>Atend.</th><th>Faturado</th></tr></thead><tbody>'+profRows+'</tbody></table></div></div>'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Horários mais movimentados</h2>'+
          '<div class="table-wrap"><table><thead><tr><th>Horário</th><th>Qtd</th></tr></thead><tbody>'+horaRows+'</tbody></table></div></div>'+
        '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Dias mais movimentados</h2>'+
          '<div class="table-wrap"><table><thead><tr><th>Dia</th><th>Qtd</th></tr></thead><tbody>'+diaRows+'</tbody></table></div></div>'+
      '</div>';

    el("rel_mode").addEventListener("change",function(){ relMode=el("rel_mode").value; renderRelatorios(); });
    if(el("rel_s")) el("rel_s").addEventListener("change",function(){ relStart=el("rel_s").value; renderRelatorios(); });
    if(el("rel_e")) el("rel_e").addEventListener("change",function(){ relEnd=el("rel_e").value; renderRelatorios(); });
    el("rel_csv").addEventListener("click",function(){
      var head=["Data","Hora","Cliente","Telefone","Servico","Profissional","Status","Preco"];
      var lines=[head.join(";")];
      data.forEach(function(a){ lines.push([a.appt_date,(a.appt_time||"").slice(0,5),
        String(a.customer_name||"").replace(/;/g,","), a.customer_phone||"",
        a.services?String(a.services.name).replace(/;/g,","):"", a.professionals?String(a.professionals.name).replace(/;/g,","):"",
        a.status, a.services?a.services.price:""].join(";")); });
      var blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
      var url=URL.createObjectURL(blob); var a2=document.createElement("a");
      a2.href=url; a2.download="relatorio-"+start+"_a_"+next+".csv"; document.body.appendChild(a2); a2.click(); a2.remove(); URL.revokeObjectURL(url);
    });
  }

  // ---------- CLIENTES (cancelamentos de última hora) ----------
  async function renderClientes(){
    var pane=el("pane-clientes");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Clientes</h1>'+
      '<p class="muted" style="margin:0 0 22px">Carregando…</p>';
    var r=await db.rpc("get_late_cancellations");
    if(r.error || !r.data || !r.data.ok){
      pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Clientes</h1>'+
        '<div class="panel" style="max-width:none"><p class="muted">Recurso não disponível ainda. Rode a <b>migração 7</b> no Supabase para ativar.</p></div>';
      return;
    }
    var list=r.data.clients||[];
    var rows=list.map(function(c){
      var wa=(c.phone||"").replace(/\D/g,"");
      var occ=(c.occurrences||[]).map(function(o){
        var d=brDate(o.date), h=(o.time||"").slice(0,5);
        var when=o.hours_before!=null?(Number(o.hours_before)>=0?Number(o.hours_before)+"h antes":"depois do horário"):"";
        return '<div class="muted" style="font-size:.8rem">'+d+' às '+h+' · cancelado '+when+'</div>';
      }).join("");
      var badgeCls = c.qtd>=3 ? "b-cancelado" : "b-pendente";
      return '<tr><td><b>'+esc(c.name||"—")+'</b><br><a href="https://wa.me/55'+wa+'" target="_blank" style="color:var(--gold);font-size:.84rem">'+esc(c.phone||"")+'</a></td>'+
        '<td><span class="badge '+badgeCls+'">'+c.qtd+'x</span></td>'+
        '<td class="muted" style="font-size:.82rem">'+new Date(c.last_at).toLocaleString("pt-BR")+'</td>'+
        '<td>'+occ+'</td>'+
        '<td><button class="btn btn-sm btn-danger" data-clearphone="'+esc(c.phone||"")+'" title="Apagar histórico deste telefone">🗑 Limpar</button></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Clientes</h1>'+
      '<p class="muted" style="margin:0 0 22px">Quem cancela em cima da hora, registrado automaticamente (ajuste o prazo em Configurações). Serve pra você acompanhar clientes que costumam furar.</p>'+
      '<div class="panel" style="max-width:none">'+
      (list.length
        ? '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Qtd.</th><th>Última vez</th><th>Ocorrências</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : '<p class="muted center">Nenhum cancelamento de última hora registrado até agora. 🎉</p>')+
      '</div>';
    pane.querySelectorAll("[data-clearphone]").forEach(function(b){
      b.addEventListener("click", async function(){
        if(!confirm("Apagar o histórico de cancelamentos de última hora deste telefone?")) return;
        b.disabled=true;
        var rr=await db.rpc("admin_clear_late_cancellations",{p_phone:b.dataset.clearphone});
        if(rr.error || !rr.data || !rr.data.ok){ alert((rr.data&&rr.data.error)||"Não foi possível limpar."); b.disabled=false; return; }
        renderClientes();
      });
    });
  }

  // ---------- BLOQUEIOS (folgas / feriados) ----------
  async function renderBloqueios(){
    var pane=el("pane-bloqueios");
    var pros=(await db.from("professionals").select("*").eq("active",true).order("sort_order")).data||[];
    var today=(function(){var d=new Date();var o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10);})();
    var { data } = await db.from("blocked_slots").select("*, professionals(name)").gte("block_date",today).order("block_date");
    data=data||[];
    var proOpts='<option value="">Todos os profissionais</option>'+pros.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");
    var rows=data.map(function(b){
      return '<tr><td><b>'+esc(brDate(b.block_date))+'</b></td>'+
        '<td>'+(b.block_time?esc(b.block_time.slice(0,5)):'<span class="muted">Dia inteiro</span>')+'</td>'+
        '<td>'+(b.professionals?esc(b.professionals.name):'<span class="muted">Todos</span>')+'</td>'+
        '<td>'+esc(b.reason||"")+'</td>'+
        '<td><button class="btn btn-sm btn-danger" data-delb="'+b.id+'">Remover</button></td></tr>';
    }).join("");
    pane.innerHTML='<h1 style="font-family:var(--serif);font-size:1.9rem;margin:0 0 6px">Bloqueios de agenda</h1>'+
      '<p class="muted" style="margin:0 0 22px">Folgas, feriados ou intervalos. Horário bloqueado some da agenda pros clientes.</p>'+
      '<div class="panel" style="max-width:none;margin-bottom:22px"><h2 style="font-family:var(--serif);margin-top:0">Novo bloqueio</h2>'+
      '<div class="grid g4">'+
        '<div class="field"><label>Data</label><input type="date" id="b_date" min="'+today+'"></div>'+
        '<div class="field"><label>Horário (vazio = dia inteiro)</label><input type="time" id="b_time"></div>'+
        '<div class="field"><label>Profissional</label><select id="b_pro">'+proOpts+'</select></div>'+
        '<div class="field"><label>Motivo (opcional)</label><input id="b_reason" placeholder="Folga, feriado..."></div>'+
      '</div><button class="btn btn-gold" id="b_save">Adicionar bloqueio</button> <span class="muted" id="b_msg" style="margin-left:10px"></span></div>'+
      '<div class="panel" style="max-width:none"><h2 style="font-family:var(--serif);margin-top:0">Próximos bloqueios</h2>'+
      '<table><thead><tr><th>Data</th><th>Horário</th><th>Profissional</th><th>Motivo</th><th></th></tr></thead><tbody>'+
      (data.length?rows:'<tr><td colspan="5" class="muted center">Nenhum bloqueio.</td></tr>')+'</tbody></table></div>';

    el("b_save").addEventListener("click", async function(){
      var d=el("b_date").value; if(!d){ el("b_msg").textContent="Escolha a data."; return; }
      var payload={ block_date:d, block_time:(el("b_time").value||null), professional_id:(el("b_pro").value||null), reason:(el("b_reason").value||"").trim() };
      el("b_save").disabled=true;
      var { error } = await db.from("blocked_slots").insert(payload);
      el("b_save").disabled=false;
      if(error){ el("b_msg").textContent="Erro ao salvar."; return; }
      renderBloqueios();
    });
    pane.querySelectorAll("[data-delb]").forEach(function(b){ b.addEventListener("click", async function(){ await db.from("blocked_slots").delete().eq("id",b.dataset.delb); renderBloqueios(); }); });
  }

  gate();
})();
</script>
</body>
